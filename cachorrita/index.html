<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hola perrita</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      color: #0f172a;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title {
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      color: #000000;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .box-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      padding: 0 2px;
    }

    textarea {
      width: 100%;
      height: 64px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.35;
      color: #000000;
      background: #ffffff;
      outline: none;
      resize: none;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    .output-area {
      background: #f8fafc;
      font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
    }

    .grid-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 9999px;
      user-select: none;
      transition: transform 0.08s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-enc {
      background: #1d4ed8;
      color: #ffffff;
    }

    .btn-dec {
      background: #0284c7;
      color: #ffffff;
    }

    .btn-tool {
      background: #f1f5f9;
      color: #0f172a;
      font-size: 11px;
      padding: 6px 8px;
    }

    .btn-tool:hover {
      background: #e2e8f0;
    }

    .toast {
      min-height: 14px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      color: #16a34a;
    }

    .toast.err {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">ꕤ Hola perrita ✰</div>

    <div class="box-container">
      <div class="box-header">
        <span>Entrada</span>
        <span id="inCount">0</span>
      </div>
      <textarea id="inTxt" placeholder="Escribe o pega aquí..."></textarea>
    </div>

    <div class="grid-btns">
      <button class="btn-enc" id="bEnc">Cifrar</button>
      <button class="btn-dec" id="bDec">Descifrar</button>
    </div>

    <div class="box-container">
      <div class="box-header">
        <span>Resultado</span>
        <span id="outCount">0</span>
      </div>
      <textarea id="outTxt" class="output-area" readonly placeholder="Salida limpia garantizada..."></textarea>
    </div>

    <div class="grid-tools">
      <button class="btn-tool" id="bSwap">Invertir</button>
      <button class="btn-tool" id="bCopy">Copiar</button>
      <button class="btn-tool" id="bClear">Limpiar</button>
    </div>

    <div class="toast" id="msg"></div>
  </div>

  <script>
    // Alfabeto estricto de 16 glifos únicos (Base-16 Nibble-Map)
    // 4 caracteres latinos + 4 números + 4 ideogramas chinos + 4 letras árabes aisladas
    // 1 byte = exactamente 2 glifos fijos (100% libre de residuos, padding, bits rotos o desincronización)
    const GLYPHS = [
      "A", "K", "X", "Z",      // Letras
      "2", "5", "7", "9",      // Números
      "龍", "夜", "星", "影",   // Chino
      "ن", "س", "م", "ك"       // Árabe
    ];

    // Mapa directo O(1) de descodificación blindado contra caracteres duplicados o mutaciones UTF-16
    const REVERSE_MAP = new Map();
    GLYPHS.forEach((glyph, index) => {
      REVERSE_MAP.set(glyph, index);
    });

    // Máscara simétrica fija de difusión por posición
    const CIPHER_KEY = [0x5B, 0x93, 0xC7, 0x1E, 0x4A, 0x82, 0xF1, 0x36];

    function notify(text, isErr = false) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = "toast" + (isErr ? " err" : "");
      clearTimeout(el.timer);
      el.timer = setTimeout(() => {
        el.textContent = "";
      }, 3000);
    }

    function encrypt(plainText) {
      if (!plainText) return "";
      const bytes = new TextEncoder().encode(plainText);
      let output = "";

      for (let i = 0; i < bytes.length; i++) {
        // Cifrado simétrico reversible por byte
        const mask = CIPHER_KEY[i % CIPHER_KEY.length] ^ ((i * 13) & 0xFF);
        const encByte = bytes[i] ^ mask;

        // Separación exacta en 2 nibbles de 4 bits (0 a 15)
        const highNibble = (encByte >> 4) & 0x0F;
        const lowNibble = encByte & 0x0F;

        output += GLYPHS[highNibble] + GLYPHS[lowNibble];
      }

      return output;
    }

    function decrypt(cipherText) {
      // Array.from asegura lectura de unidades de código completas Unicode (incluyendo ideogramas)
      const glyphs = Array.from(cipherText.replace(/\s+/g, ""));
      if (glyphs.length === 0) return "";

      if (glyphs.length % 2 !== 0) {
        throw new Error("Longitud impar: código incompleto");
      }

      const byteCount = glyphs.length / 2;
      const resultBytes = new Uint8Array(byteCount);

      for (let i = 0; i < byteCount; i++) {
        const charHigh = glyphs[i * 2];
        const charLow = glyphs[i * 2 + 1];

        const valHigh = REVERSE_MAP.get(charHigh);
        const valLow = REVERSE_MAP.get(charLow);

        if (valHigh === undefined || valLow === undefined) {
          throw new Error("Contiene símbolos no válidos en el dialecto");
        }

        const encByte = (valHigh << 4) | valLow;
        const mask = CIPHER_KEY[i % CIPHER_KEY.length] ^ ((i * 13) & 0xFF);
        resultBytes[i] = encByte ^ mask;
      }

      return new TextDecoder().decode(resultBytes);
    }

    // Interfaz y eventos
    const inTxt = document.getElementById("inTxt");
    const outTxt = document.getElementById("outTxt");
    const inCount = document.getElementById("inCount");
    const outCount = document.getElementById("outCount");

    function syncCounts() {
      inCount.textContent = Array.from(inTxt.value).length;
      outCount.textContent = Array.from(outTxt.value).length;
    }

    inTxt.addEventListener("input", syncCounts);

    document.getElementById("bEnc").addEventListener("click", () => {
      try {
        const val = inTxt.value;
        if (!val) return notify("Escribe texto para cifrar", true);
        outTxt.value = encrypt(val);
        syncCounts();
        notify("Cifrado correctamente");
      } catch (e) {
        notify(e.message, true);
      }
    });

    document.getElementById("bDec").addEventListener("click", () => {
      try {
        const val = inTxt.value;
        if (!val) return notify("Pega el texto para descifrar", true);
        outTxt.value = decrypt(val);
        syncCounts();
        notify("Descifrado al 100%");
      } catch (e) {
        notify(e.message, true);
      }
    });

    document.getElementById("bSwap").addEventListener("click", () => {
      const tmp = inTxt.value;
      inTxt.value = outTxt.value;
      outTxt.value = tmp;
      syncCounts();
      notify("Invertido");
    });

    document.getElementById("bCopy").addEventListener("click", () => {
      if (!outTxt.value) return notify("Nada que copiar", true);
      navigator.clipboard.writeText(outTxt.value).then(() => notify("Copiado"));
    });

    document.getElementById("bClear").addEventListener("click", () => {
      inTxt.value = "";
      outTxt.value = "";
      syncCounts();
      notify("Limpio");
    });
  </script>
</body>
</html>
